<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141a">
  <title>Try-On</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
  { "imports": {
    "@decartai/sdk": "/vendor/sdk/index.js",
    "zod": "/vendor/zod/index.js",
    "mitt": "/vendor/mitt/mitt.mjs",
    "p-retry": "/vendor/p-retry/index.js",
    "retry": "/vendor/retry.js",
    "is-network-error": "/vendor/is-network-error/index.js",
    "livekit-client": "/vendor/livekit/livekit-client.esm.mjs",
    "jose": "/vendor/jose/index.js"
  } }
  </script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Try-On</h1>
      <p>로컬에서만 여는 체험 패널</p>
    </header>

    <div class="modes" role="group" aria-label="체험 종류">
      <button type="button" id="tab-reference" aria-pressed="true">헤어</button>
      <button type="button" id="tab-preset" aria-pressed="false">모수</button>
    </div>

    <p id="error" class="notice error" role="alert" hidden></p>

    <div class="stage" id="stage">
      <video id="output" autoplay playsinline muted hidden></video>
      <img id="captured-image" class="result" alt="" hidden>

      <!-- 레퍼런스: 대기 -->
      <div id="ref-layer-idle" class="ref-layer">
        <label class="ref-upload-hit">
          <span>따라하고 싶은 헤어 사진을 올려주세요</span>
          <input id="ref-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        </label>
      </div>

      <!-- 레퍼런스: 준비 -->
      <div id="ref-layer-ready" class="ref-layer" hidden>
        <img id="ref-ready-thumb" alt="고른 헤어 사진">
        <button type="button" id="ref-change" class="ghost ref-change">다른 사진</button>
      </div>

      <!-- 레퍼런스: 촬영 -->
      <div id="ref-layer-capture" class="ref-layer ref-capture-layer" hidden>
        <video id="selfie-video" autoplay playsinline muted></video>
        <div id="selfie-guide" class="selfie-guide" aria-hidden="true"></div>
        <p id="ref-capture-hint" class="ref-overlay-text">정면을 봐주세요</p>
        <p id="ref-countdown" class="ref-countdown" hidden>3</p>
      </div>

      <!-- 레퍼런스: 생성 중 -->
      <div id="ref-layer-generating" class="ref-layer ref-generating-layer" hidden>
        <img id="ref-freeze" alt="">
        <div class="ref-generating-overlay">
          <span class="ref-spinner" aria-hidden="true"></span>
          <p>헤어 스타일 입히는 중…</p>
        </div>
      </div>

      <!-- 레퍼런스: 라이브 썸네일 / 메시지 -->
      <img id="ref-live-thumb" class="ref-live-thumb" alt="레퍼런스" hidden>
      <div id="ref-stage-banner" class="ref-stage-banner" hidden>
        <p id="ref-stage-message"></p>
        <button type="button" id="ref-stage-action" hidden></button>
      </div>

      <p id="stage-label" hidden>연결을 누르면 카메라가 켜집니다</p>
      <span id="combo-label" class="chip top-left" hidden>헤어라인 · 부분</span>
      <span id="connection-state" class="chip top-right" hidden>연결 준비</span>
      <span id="expected-chip" class="chip bottom" hidden>예상 이미지</span>
      <span id="remaining" class="chip top-left" hidden>120초 남음</span>
      <span id="resolution" class="chip top-right" style="top:auto;bottom:10px;right:10px;left:auto" hidden></span>
    </div>

    <!-- 레퍼런스 하단 -->
    <div id="ref-bottom" class="ref-bottom">
      <div id="ref-ready-bar" hidden>
        <label class="check ref-consent-line">
          <input id="ref-consent-check" type="checkbox">
          <span>미리보기 생성을 위해 사진을 외부 AI로 보냅니다. 저장하지 않습니다. <button type="button" id="ref-consent-detail" class="linkish">자세히</button></span>
        </label>
        <p id="ref-consent-extra" class="fine" hidden></p>
        <button type="button" id="ref-start" disabled>체험 시작</button>
      </div>
      <div id="ref-live-bar" class="actions" hidden>
        <button type="button" id="ref-capture" disabled>캡처</button>
        <button type="button" id="ref-end">종료</button>
      </div>
    </div>

    <!-- 모수: 같은 화면, 드롭 대신 조합 -->
    <div id="preset-bar" class="preset-bar" hidden>
      <div class="preset-row area-buttons" data-areas role="group" aria-label="부위"></div>
      <div class="preset-row density combo-buttons" data-combos></div>
    </div>

    <div id="preset-actions" class="actions" hidden>
      <button type="button" id="connect">연결</button>
      <button type="button" id="disconnect" disabled>끊기</button>
    </div>

    <p id="status" role="status" hidden>부위를 고른 뒤 연결을 누르세요.</p>
    <p id="billing-note" class="fine" hidden>연결을 누른 뒤부터 초당 $0.02입니다. 한 세션은 120초에서 끊깁니다.</p>

    <!-- 리드/랩/캡처 오버레이 (한 화면 흐름 유지) -->
    <div id="product-actions" class="actions" hidden>
      <button type="button" id="save-result" disabled>결과 저장</button>
      <button type="button" id="referral" disabled>병원 소개</button>
    </div>
    <div id="lab-actions" hidden>
      <label for="pose">촬영 포즈
        <select id="pose"><option>정면</option><option>좌회전</option><option>우회전</option><option>숙임</option></select>
      </label>
      <button type="button" id="lab-capture" disabled>PNG 캡처</button>
      <p id="lab-conditions" class="fine"></p>
    </div>
    <input id="ref-replace-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <progress id="time-bar" max="120" value="120" hidden aria-label="남은 연결 시간"></progress>

    <div id="contact" class="overlay" hidden>
      <div class="overlay-card" aria-labelledby="contact-title">
        <h1 id="contact-title">결과 저장</h1>
        <img id="contact-preview" alt="예상 이미지">
        <span id="captured-label" class="fine"></span>
        <form id="lead-form">
          <label for="name">이름<input id="name" name="name" autocomplete="name" maxlength="50" required></label>
          <label for="phone">휴대폰<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="010-1234-5678" maxlength="20"></label>
          <label for="region">지역<select id="region" name="region" required><option value="">시·도 선택</option></select></label>
          <label class="check"><input id="consent" type="checkbox" required><span>개인정보 수집·이용에 동의합니다. <strong>(필수)</strong></span></label>
          <details><summary>수집·이용 내용 보기</summary><p id="privacy-text"></p></details>
          <div id="third-party" hidden>
            <label class="check"><input id="third-consent" type="checkbox"><span>병원 소개를 위한 제3자 제공에 동의합니다. <strong>(필수)</strong></span></label>
            <details><summary>제3자 제공 내용 보기</summary><p id="referral-text"></p></details>
          </div>
          <p id="form-error" class="notice error" role="alert" hidden></p>
          <button id="submit-lead" type="submit" disabled>결과 저장</button>
        </form>
        <button type="button" id="close-form" class="ghost">취소</button>
      </div>
    </div>

    <div id="complete" class="overlay" hidden>
      <div class="overlay-card" aria-labelledby="complete-title">
        <h1 id="complete-title">저장 완료</h1>
        <p id="complete-message" class="fine"></p>
        <img id="saved-image" alt="저장한 예상 이미지">
        <button type="button" id="download-saved">PNG 다운로드</button>
        <button type="button" class="ghost" id="complete-back">닫기</button>
      </div>
    </div>

    <!-- 호환용 숨김 노드 (기존 JS/테스트 ID 유지) -->
    <div hidden>
      <div id="panel-preset"></div>
      <div id="panel-reference"></div>
      <section id="selection"></section>
      <section id="preparation"></section>
      <section id="experience"></section>
      <section id="ended"></section>
      <section id="ref-upload"></section>
      <section id="ref-preparation"></section>
      <section id="ref-experience"></section>
      <section id="ref-result"></section>
      <section id="ref-ended"></section>
      <video id="preview" autoplay muted playsinline></video>
      <video id="ref-preview" autoplay muted playsinline></video>
      <video id="ref-output" autoplay muted playsinline></video>
      <img id="ref-original" alt="">
      <img id="ref" alt="">
      <img id="ref-thumb" alt="">
      <img id="ref-captured-image" alt="">
      <div id="drop"></div>
      <p id="drop-label"></p>
      <button id="clear" type="button"></button>
      <p id="ref-summary"></p>
      <div id="ref-live-actions"></div>
      <button id="ref-replace" type="button"></button>
      <div id="ref-previews"></div>
      <div id="camera-guide"></div>
      <p id="preparation-guidance"></p>
      <p id="experience-guidance"></p>
      <p id="camera-message"></p>
      <p id="preview-label"></p>
      <p id="ended-title"></p>
      <p id="ended-message"></p>
      <p id="ref-status"></p>
      <p id="ref-live-status"></p>
      <p id="ref-camera-message"></p>
      <p id="ref-ended-title"></p>
      <p id="ref-ended-message"></p>
      <p id="ref-drop-label"></p>
      <span id="ref-connection-state"></span>
      <span id="ref-remaining"></span>
      <span id="ref-resolution"></span>
      <progress id="ref-time-bar" max="120" value="120"></progress>
      <button id="prepare" type="button"></button>
      <button id="experience-start" type="button"></button>
      <button id="retry" type="button"></button>
      <button id="ref-connect" type="button"></button>
      <button id="ref-disconnect" type="button"></button>
      <button id="ref-prepare" type="button"></button>
      <button id="ref-pick" type="button"></button>
      <button id="ref-clear" type="button"></button>
      <button id="ref-back-upload" type="button"></button>
      <button id="ref-restart" type="button"></button>
      <button id="ref-retry" type="button"></button>
      <button id="ref-download" type="button"></button>
      <div id="ref-drop"></div>
      <label id="ref-pick-label" class="file"></label>
      <div id="saved-stage"></div>
    </div>
  </main>
</body>
</html>
